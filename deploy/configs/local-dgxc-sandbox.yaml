# =============================================================================
# NVIDIA Config Manager - Local DGX Cloud Sandbox Config
# =============================================================================
# Same as local-dgxc.yaml but with mock_devices disabled so that Temporal
# workflows use real CumulusConnection / AristaConnection classes to reach
# the mock device API pods (FastAPI with version-aware fixtures).
#
# Used by: make sandbox-up (dgx_cloud topology)
# =============================================================================

version: "1"

cluster:
  hostname: config-manager.local
  environment: local
  namespace: nv-config-manager
  release_name: nv-config-manager
  airgapped: false
  mock_devices: false
  size: small

secrets:
  method: kubernetes
  config_manager_service_username: nv-config-manager
  k8s:
    nautobot_app:
      values:
        adminPassword: admin

network_secrets:
  - name: Hash Salt
    description: Password hashing salt for user accounts
    source: generate
    secret_key: hash_salt
    rotation: r1
    required: true
  - name: BGP Password
    description: BGP peering authentication
    source: generate
    secret_key: bgp_password
    rotation: r1
    required: true
  - name: Device Admin Password
    description: Admin/root password for managed devices
    source: generate
    secret_key: root_password
    rotation: r1
    required: true
  - name: NVIDIA Config Manager API Key
    description: NVIDIA Config Manager service account device credential
    source: generate
    secret_key: api_user_key
    rotation: r1
    required: true

sites:
  - name: dc01

sso:
  enabled: false

spiffe:
  enabled: false

content:
  jobs:
    - path: development/mock_topology
  template_plugins: []
  include_bootstrap_jobs: true
  run_after_deploy:
    - job: mock_topology.jobs.mock_topology_design.MockTopologyDesign
      input: '{"blueprint": "dgx_cloud", "deployment_name": "test"}'

services:
  render: true
  ztp: true
  dhcp: true
  temporal: true
  config_store: true
  nautobot: true

# Workflow RBAC defaults to open (all roles = "all") when omitted.
# To restrict workflows, add an rbac: section -- see installer README.

infrastructure:
  gateway: envoyGateway
  tls: true
  cnpg_s3_backup:
    enabled: false
  monitoring:
    enabled: false
  load_balancer:
    provider: ""

{{/* GatewayClass ownership belongs to Envoy Gateway when chart-managed. */}}
{{- $createGatewayClass := true }}
{{- if hasKey .Values.gateway "createGatewayClass" }}
  {{- $createGatewayClass = .Values.gateway.createGatewayClass }}
{{- end }}
{{- if and .Values.gateway.enabled .Values.gateway.create $createGatewayClass (eq (.Values.gateway.type | default "envoyGateway") "envoyGateway") }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gateway.className }}
  labels:
    {{- include "nv-config-manager.labels" . | nindent 4 }}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  description: "Envoy Gateway for NVIDIA Config Manager"
{{- end }}

{{- if and .Values.gateway.enabled .Values.gateway.create }}
{{- $tlsCertName := include "nv-config-manager.componentName" (dict "root" . "component" "gateway-tls") }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
  {{- include "nv-config-manager.labels" . | nindent 4 }}
  {{- $envoyImage := dig "envoyProxy" "image" "" .Values.gateway }}
  {{- $envoyResources := dig "envoyProxy" "resources" nil .Values.gateway }}
  {{- $gatewayType := include "nv-config-manager.gatewayControllerType" . }}
  {{- $isEnvoyGateway := eq $gatewayType "envoyGateway" }}
  {{- $isKgateway := eq $gatewayType "kgateway" }}
  {{- $useOwnProxy := and $isEnvoyGateway (or .Values.gateway.hostNetwork.enabled .Values.gateway.hostPorts.enabled (dig "nodePort" "enabled" false .Values.gateway) .Values.gateway.nlb (dig "envoyProxy" "enabled" false .Values.gateway) $envoyImage $envoyResources) }}
  {{- $proxyName := .Values.gateway.envoyProxy.name | default (printf "%s-proxy" .Values.gateway.name) }}
  {{- $kgatewayParametersName := printf "%s-parameters" .Values.gateway.name }}
  {{- if $useOwnProxy }}
  annotations:
    gateway.envoyproxy.io/envoy-proxy: {{ $proxyName }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  {{- if $useOwnProxy }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ $proxyName }}
  {{- else if and $isKgateway (dig "nodePort" "enabled" false .Values.gateway) }}
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: {{ $kgatewayParametersName }}
  {{- end }}
  listeners:
  {{- range .Values.gateway.listeners }}
  - name: {{ .name }}
    protocol: {{ .protocol }}
    port: {{ .port }}
    {{- if and (eq .protocol "HTTPS") .tls }}
    tls:
      mode: {{ .tls.mode }}
      certificateRefs:
      - kind: {{ .tls.certificateRef.kind }}
        name: {{ $tlsCertName }}
        namespace: {{ $.Values.global.namespace }}
    {{- end }}
    allowedRoutes:
      namespaces:
        from: Same
  {{- end }}
{{- end }}

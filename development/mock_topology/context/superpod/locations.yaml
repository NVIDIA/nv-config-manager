---

locations:
  - name: Example Corp
    location_type: Provider

  - name: Region-A
    location_type: Region
    parent: Example Corp

  - name: Country-A
    location_type: Region
    parent: Region-A

  - name: TEST-SITE
    location_type: Site
    parent: Country-A

  - name: "TEST-SITE SUPERPOD 1 - {{ deployment_name }}"
    location_type: Module
    parent: TEST-SITE
    ref: location

config_contexts:
  - name: "TEST-SITE site-asn"
    description: "Site-level BGP ASN configuration for TEST-SITE"
    weight: 1000
    is_active: true
    locations:
      - TEST-SITE
    data:
      site_asn: "4230000001"

  - name: "TEST-SITE Management Services"
    description: "Management services configuration for TEST-SITE"
    weight: 1000
    is_active: true
    locations:
      - TEST-SITE
    data:
      dns:
        ipv4:
          - "192.0.2.8"
          - "192.0.2.9"
      ntp:
        ipv4:
          - "192.0.2.8"
          - "192.0.2.9"
      ztp:
        ipv4:
          - "192.0.2.10"
      Dhcp4:
        option-def:
          - code: 239
            name: cumulus-provision-url
            type: string
            array: false
            space: dhcp4
            encapsulate: ""
            record-types: ""
      dhcp:
        nvConfigManager:
          ipv4:
            - "192.0.2.8"
            - "192.0.2.9"
        superpod:
          ipv4:
            - "192.0.2.8"
            - "192.0.2.9"
      management_prefixes:
        ipv4:
          - "192.0.2.0/23"
          - "10.78.144.0/20"
      provisioning_servers:
        ipv4:
          - "192.0.2.10"

  - name: "TEST-SITE Sandbox DHCP Subnet"
    description: "DHCP subnet for Kind pod network enabling in-cluster DHCP testing"
    schema: nv-config-manager-kea-static-data
    weight: 900
    is_active: true
    locations:
      - TEST-SITE
    data:
      Dhcp4:
        subnet4:
          - subnet: "10.244.0.0/16"
            option-data: []
            reservations-global: false
            reservations-in-subnet: false
            pools:
              - pool: "10.244.0.200 - 10.244.0.250"

  - name: "Superpod-dhcp-options"
    description: "DHCP options for Superpod network devices"
    weight: 1000
    is_active: true
    roles:
      - OOB-Leaf
      - OOB-Spine
      - In-Band-Leaf
      - Mgmt-Leaf
      - Border-Leaf
      - Storage-Leaf
      - Converged-Spine
      - Power-Leaf
    data:
      dhcp:
        options:
          interface_names:
            eth0:
              subnet_config:
                reservations-global: true
                reservations-in-subnet: false
              reservation_options:
                boot-file-name: "http://{{ztp_server}}/v1/device/{{device_id}}/onie"
                cumulus-provision-url: "http://{{ztp_server}}/v1/device/{{device_id}}/boot-script"

# Mock device API deployments for sandbox testing.
# Each deployment emulates a network device (Cumulus NVUE) using version-aware
# fixtures generated from development/mock_topology/context/superpod/devices/.
#
# These correspond to devices in the superpod mock topology.
# NVIDIA Config Manager's Temporal workflows can connect to them via their Service IPs.
#
# Usage:
#   make mock-devices-up
#   kubectl apply -f development/mock_devices/manifests/mock-devices.yaml
---
# OOB-Leaf (a04-u44-p01-tor-01) — MSN2201
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-sp-tor-01
  namespace: nv-config-manager
  labels:
    app: mock-device
    mock-device-role: oob-leaf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-device
      mock-device-name: a04-u44-p01-tor-01
  template:
    metadata:
      labels:
        app: mock-device
        mock-device-name: a04-u44-p01-tor-01
        mock-device-platform: cumulus
    spec:
      containers:
      - name: device-api
        image: mock-device:local
        args: ["serve"]
        env:
        - name: MOCK_DEVICE_NAME
          value: "a04-u44-p01-tor-01"
        - name: MOCK_DEVICE_PLATFORM
          value: "cumulus"
        - name: MOCK_DEVICE_SERIAL
          value: "44:38:39:20:00:01"
        - name: MOCK_DEVICE_OS_VERSION
          value: "5.13.1"
        - name: MOCK_DEVICE_API_PORT
          value: "8765"
        ports:
        - containerPort: 8765
          name: nvue-api
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
---

# DHCP validation job (no DHCP packets sent - queries Kea API directly).
#
# Usage:
#   envsubst < mock-dhcp-validate.yaml | kubectl apply -f -
#   kubectl logs -n nv-config-manager job/mock-dhcp-validate -f
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mock-dhcp-validate
  namespace: ${NAMESPACE}
  labels:
    app: mock-dhcp-client
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: mock-dhcp-client
    spec:
      containers:
      - name: dhcp-validator
        image: mock-device:local
        args:
        - validate
        - --name=${MOCK_DHCP_DEVICE}
        - --platform=${MOCK_DHCP_PLATFORM}
        - --serial=${MOCK_DHCP_SERIAL}
        - --mac=${MOCK_DHCP_MAC}
        - --client-id-template=${MOCK_DHCP_CLIENT_ID_TPL}
        - --dhcp-api-url=http://nv-config-manager-dhcp-internal.nv-config-manager.svc.cluster.local:9000
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      restartPolicy: Never

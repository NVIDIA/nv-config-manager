[project]
name = "mock-device"
version = "0.1.0"
description = "Mock network device API for NV Config Manager local development"
authors = [{ name = "NVIDIA Corporation" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.0",
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "requests>=2.31.0",
    "scapy>=2.6.1",
    "uvicorn>=0.34.0",
]

[project.scripts]
mock-device = "mock_device.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mock_device"]

---
# =============================================================================
# Artifact-affecting paths - used to skip builds for non-artifact changes
# =============================================================================
# These paths affect the published artifacts (images and charts):
#   - build/**          - Dockerfiles and build configurations
#   - components/**     - Go code (nats-ready), Nautobot config
#   - packages/**       - Public Python libraries
#   - plugins/**        - Installable extension implementations
#   - db/**             - Database migrations
#   - deploy/helm/**    - Helm charts
#   - src/**            - Python source code
#   - ui/**             - Frontend code
#   - pyproject.toml    - Python dependencies
#   - uv.lock           - Python lock file
# =============================================================================

.artifact-paths: &artifact-paths
  - "build/**/*"
  - "components/**/*"
  - "packages/**/*"
  - "plugins/**/*"
  - "db/**/*"
  - "deploy/helm/**/*"
  - "src/**/*"
  - "ui/**/*"
# =============================================================================
# Deploy Stage
# =============================================================================

# Historical main-branch RC version calculation is disabled. Releases are now
# driven only by upstream Git tags mirrored into GitLab.
determine-new-version:
  stage: deploy
  tags:
    - dca
    - linux/amd64
    - docker
  image: $NVCM_CI_IMAGE_ALPINE
  rules:
    - when: never
  before_script:
    - apk add --no-cache bash curl git jq coreutils
  script:
    - echo "Main-branch release version calculation is disabled; publish an upstream semver tag to release."
  artifacts:
    reports:
      dotenv: build.env
  needs:
    - job: docker-manifest-main
      optional: false
    - job: test-main-py
      optional: true
    - job: test-main-network-templates
      optional: true

# Historical main-branch values preview is disabled. Tag release jobs update
# packaged chart values in-place without committing back to the mirror.
update-image-tags:
  image: $NVCM_CI_IMAGE_ALPINE
  stage: deploy
  tags:
    - dca
    - linux/amd64
    - docker
  rules:
    - when: never
  needs:
    - job: determine-new-version
      artifacts: true
  variables:
    VALUES_FILE_PATH: deploy/helm/values.yaml
  before_script:
    - apk add --no-cache git yq
  script:
    - echo "Previewing image tags and chart version for $NEW_VERSION"
    # Update chart version in Chart.yaml (version and appVersion)
    - yq -i '.version = "'$NEW_VERSION'"' deploy/helm/Chart.yaml
    - yq -i '.appVersion = "'$NEW_VERSION'"' deploy/helm/Chart.yaml
    # Update all image tags in global.images section
    - yq -i '.global.images.nvConfigManager.tag = "'$NEW_VERSION'"' $VALUES_FILE_PATH
    - yq -i '.global.images.nvConfigManagerUi.tag = "'$NEW_VERSION'"' $VALUES_FILE_PATH
    - yq -i '.global.images.kea.tag = "'$NEW_VERSION'"' $VALUES_FILE_PATH
    - yq -i '.global.images.keaAdmin.tag = "'$NEW_VERSION'"' $VALUES_FILE_PATH
    - yq -i '.global.images.nautobot.tag = "'$NEW_VERSION'"' $VALUES_FILE_PATH
    - yq -i '.global.images.natsReady.tag = "'$NEW_VERSION'"' $VALUES_FILE_PATH
    - yq -i '.global.images.temporalServer.tag = "'$NEW_VERSION'"' $VALUES_FILE_PATH
    - yq -i '.global.images.temporalBootstrap.tag = "'$NEW_VERSION'"' $VALUES_FILE_PATH
    - yq -i '.global.images.temporalUi.tag = "'$NEW_VERSION'"' $VALUES_FILE_PATH
    - git diff -- deploy/helm/Chart.yaml $VALUES_FILE_PATH
    - echo "Skipping commit/push so the mirror does not diverge from upstream."

# Update image tags for nv-config-manager-test environment in external values repo (manual trigger)
# This job deploys to nv-config-manager-test namespace for testing before merging to main
# Required CI/CD Variables:
#   NV_CONFIG_MANAGER_VALUES_PUSH_TOKEN - GitLab token with write access to the downstream values repository
deploy-to-test:
  image: $NVCM_CI_IMAGE_ALPINE
  stage: deploy
  tags:
    - dca
    - linux/amd64
    - docker
  rules:
    - if: $GITLAB_USER_EMAIL == $CI_PUSH_EMAIL
      when: never
    # Available on merge requests (for testing before merge)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    # Also available on main branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - when: never
  needs:
    # Only wait for amd64 builds for faster test deployments
    - job: docker-build-mr-amd64
      optional: true
    - job: docker-build-main-amd64
      optional: true
    - job: determine-new-version
      artifacts: true
      optional: true
  variables:
    TARGET_NAMESPACE: "$NVCM_TEST_NAMESPACE"
    VALUES_FILE_PATH: "$NVCM_TEST_VALUES_FILE_PATH"
    VALUES_BRANCH: "$NVCM_TEST_VALUES_BRANCH"
    CHART_DEPLOYMENT_BRANCH: "$NVCM_TEST_CHART_BRANCH"
    # Default values repo path - override with CI/CD variable if different
    NV_CONFIG_MANAGER_VALUES_REPO_PATH: "$NVCM_VALUES_REPO_PATH"
  before_script:
    - apk add --no-cache bash git yq curl jq rsync
    - git config --global user.email "${CI_PUSH_EMAIL:-ci@nv-config-manager}"
    - git config --global user.name "NVIDIA Config Manager CI"
  script:
    - |
      set -e
      
      # Determine version to deploy based on pipeline context
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        # For MR pipelines, use the MR-built amd64 images for faster deployment
        DEPLOY_VERSION="${CI_COMMIT_SHORT_SHA}-amd64"
        SOURCE_REF="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
        echo "🔀 Merge Request pipeline detected"
        echo "📦 Deploying version ${DEPLOY_VERSION} to ${TARGET_NAMESPACE} (amd64)"
      elif [ -n "$NEW_VERSION" ]; then
        # For main branch with new release, use the RC version
        DEPLOY_VERSION="$NEW_VERSION"
        SOURCE_REF="main"
        echo "🏷️  Release version detected: ${DEPLOY_VERSION}"
        echo "📦 Deploying version ${DEPLOY_VERSION} to ${TARGET_NAMESPACE}"
      else
        # No artifact changes on main - nothing new to deploy
        echo "⚠️  No new version available (no artifact changes in this pipeline)"
        echo "ℹ️  This job should only be run when:"
        echo "   - On merge requests (to test MR changes)"
        echo "   - On main after artifact changes (to deploy new RC version)"
        echo ""
        echo "Skipping deployment."
        exit 0
      fi
      
      echo "   Pipeline: ${CI_PIPELINE_SOURCE}"
      echo "   Branch/MR: ${CI_COMMIT_REF_NAME}"
      image_target_exports="$(bash "${CI_PROJECT_DIR}/.gitlab/ci/scripts/image_target_env.sh" "${NVCM_VALUES_IMAGE_TARGET:-}")" || exit $?
      eval "$image_target_exports"
      IMAGE_TARGET_TOKEN="$(printenv "$NVCM_IMAGE_TOKEN_VAR" || true)"
      if [ -z "$IMAGE_TARGET_TOKEN" ]; then
        echo "❌ Image target ${NVCM_IMAGE_TARGET_NAME} references ${NVCM_IMAGE_TOKEN_VAR}, but it is empty or unset"
        exit 1
      fi
      echo "   Image target: ${NVCM_IMAGE_TARGET_NAME}"
      echo "   Image repository: ${NVCM_IMAGE_REPOSITORY}"
      
      # =================================================================
      # Verify images exist in registry before deploying
      # =================================================================
      echo ""
      echo "🔍 Verifying images exist in registry..."
      
      # Check if the main nv-config-manager image exists (if this exists, others should too)
      IMAGE_NAME="nv-config-manager"
      NGC_API_URL="${NVCM_NGC_API_BASE}/org/${NVCM_NGC_ORG}/team/${NVCM_NGC_TEAM}/repos/${IMAGE_NAME}/tags/${DEPLOY_VERSION}"
      
      echo "Checking if image exists: ${NVCM_IMAGE_REPOSITORY}/${IMAGE_NAME}:${DEPLOY_VERSION}"
      echo "API URL: ${NGC_API_URL}"
      
      # Try the API call and capture both status code and response
      RESPONSE=$(mktemp)
      HTTP_CODE=$(curl -s -w "%{http_code}" -o "${RESPONSE}" \
        -H "Authorization: Bearer ${IMAGE_TARGET_TOKEN}" \
        "${NGC_API_URL}")
      
      echo "HTTP Status: ${HTTP_CODE}"
      
      if [ "$HTTP_CODE" = "200" ]; then
        echo "✅ Image ${DEPLOY_VERSION} exists in registry"
      elif [ "$HTTP_CODE" = "404" ]; then
        echo "❌ ERROR: Image ${DEPLOY_VERSION} does not exist in registry!"
        echo ""
        echo "This usually means:"
        echo "  - The build job (docker-build-mr-amd64 or docker-build-main-amd64) didn't run"
        echo "  - The build job failed"
        echo "  - Change detection didn't trigger the build (try manual build trigger)"
        echo ""
        echo "Please ensure the build job completes successfully before deploying."
        rm -f "${RESPONSE}"
        exit 1
      else
        echo "⚠️  Unexpected HTTP status: ${HTTP_CODE}"
        echo "API Response:"
        cat "${RESPONSE}"
        echo ""
        echo "Continuing anyway - will deploy and let ArgoCD validate..."
        rm -f "${RESPONSE}"
        # Don't exit - continue with deployment
      fi
      
      rm -f "${RESPONSE}"
      
      # =================================================================
      # Step 1: Push Helm chart to nv-config-manager deployment branch
      # =================================================================
      echo ""
      echo "📊 Step 1: Updating Helm chart in ${CHART_DEPLOYMENT_BRANCH} branch"
      
      # Clone this repo to a separate directory
      CHART_REPO_URL="https://oauth2:${CI_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git clone "${CHART_REPO_URL}" chart-repo
      cd chart-repo
      
      # Checkout or create deployment branch
      if git ls-remote --heads origin "${CHART_DEPLOYMENT_BRANCH}" | grep -q "${CHART_DEPLOYMENT_BRANCH}"; then
        echo "Checking out existing branch: ${CHART_DEPLOYMENT_BRANCH}"
        git fetch origin "${CHART_DEPLOYMENT_BRANCH}"
        git checkout "${CHART_DEPLOYMENT_BRANCH}"
      else
        echo "Creating new branch: ${CHART_DEPLOYMENT_BRANCH}"
        git checkout -b "${CHART_DEPLOYMENT_BRANCH}"
      fi
      
      # Fetch the source branch/commit content
      git fetch origin "${SOURCE_REF}"
      
      # Copy deploy/helm from source commit
      echo "Syncing deploy/helm/ from ${SOURCE_REF}"
      git rm -rf deploy/helm
      git checkout "origin/${SOURCE_REF}" -- deploy/helm
      
      # Set chart version and appVersion. Helm requires chart version to be valid semver.
      # For MR pipelines DEPLOY_VERSION is ${CI_COMMIT_SHORT_SHA}-amd64 (invalid semver).
      # Keep version from source; set appVersion to deploy tag for image refs.
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        yq -i '.appVersion = "'${DEPLOY_VERSION}'"' deploy/helm/Chart.yaml
      else
        yq -i '.version = "'${DEPLOY_VERSION}'"' deploy/helm/Chart.yaml
        yq -i '.appVersion = "'${DEPLOY_VERSION}'"' deploy/helm/Chart.yaml
      fi
      bash "${CI_PROJECT_DIR}/.gitlab/ci/scripts/update_helm_image_values.sh" deploy/helm/values.yaml "$NVCM_IMAGE_REPOSITORY" "$DEPLOY_VERSION"
      git add deploy/helm/Chart.yaml deploy/helm/values.yaml
      
      # Check if there are changes (compare staged changes to HEAD)
      if git diff --cached --quiet; then
        echo "✓ No chart changes to commit"
      else
        echo "📋 Chart changes detected:"
        git diff --cached --stat
        
        # Commit chart changes (files are already staged by git checkout)
        git commit -m "[CI] Update helm chart from ${SOURCE_REF} for ${TARGET_NAMESPACE}
        
        Source commit: ${CI_COMMIT_SHA}
        Triggered by: ${GITLAB_USER_NAME:-CI}
        Pipeline: ${CI_PIPELINE_URL}"
        
        git push origin "HEAD:refs/heads/${CHART_DEPLOYMENT_BRANCH}"
        echo "✅ Helm chart updated in ${CHART_DEPLOYMENT_BRANCH}"
      fi
      
      cd ..
      
      # =================================================================
      # Step 2: Update image repositories and tags in values repo
      # =================================================================
      echo ""
      echo "🏷️  Step 2: Updating image repositories and tags in downstream values repository"
      
      # Use provided repo URL or construct from path
      if [ -n "$NV_CONFIG_MANAGER_VALUES_REPO_URL" ]; then
        VALUES_REPO="${NV_CONFIG_MANAGER_VALUES_REPO_URL}"
      else
        VALUES_REPO="${NV_CONFIG_MANAGER_VALUES_REPO_PATH}"
      fi
      
      echo "📁 Cloning values repository: ${VALUES_REPO}"
      echo "   Branch: ${VALUES_BRANCH}"
      
      # Clone the values repository
      VALUES_REPO_URL="https://oauth2:${NV_CONFIG_MANAGER_VALUES_PUSH_TOKEN}@${CI_SERVER_HOST}/${VALUES_REPO}.git"
      git clone "${VALUES_REPO_URL}" values-repo
      cd values-repo
      
      # Checkout or create the target branch
      if git ls-remote --heads origin "${VALUES_BRANCH}" | grep -q "${VALUES_BRANCH}"; then
        echo "Checking out existing branch: ${VALUES_BRANCH}"
        git fetch origin "${VALUES_BRANCH}"
        git checkout "${VALUES_BRANCH}"
      else
        echo "Creating new branch: ${VALUES_BRANCH}"
        git checkout -b "${VALUES_BRANCH}"
      fi
      
      # Check if values file exists
      if [ ! -f "${VALUES_FILE_PATH}" ]; then
        echo "❌ Error: ${VALUES_FILE_PATH} not found in values repository"
        echo "Available files:"
        ls -la
        exit 1
      fi
      
      echo "📝 Updating image repositories and tags in ${VALUES_FILE_PATH}"
      
      bash "${CI_PROJECT_DIR}/.gitlab/ci/scripts/update_helm_image_values.sh" "${VALUES_FILE_PATH}" "$NVCM_IMAGE_REPOSITORY" "$DEPLOY_VERSION"
      
      # Check if there are changes
      if git diff --quiet ${VALUES_FILE_PATH}; then
        echo "⚠️  No changes to commit - image repositories and tags are already at ${DEPLOY_VERSION}"
        exit 0
      fi
      
      echo "📋 Changes to be committed:"
      git diff ${VALUES_FILE_PATH}
      
      # Build commit message with context
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        COMMIT_CONTEXT="MR !${CI_MERGE_REQUEST_IID}: ${CI_MERGE_REQUEST_TITLE}"
      else
        COMMIT_CONTEXT="Branch: ${CI_COMMIT_REF_NAME}"
      fi
      
      # Commit and push changes
      git add ${VALUES_FILE_PATH}
      git commit -m "[nv-config-manager CI] Deploy ${DEPLOY_VERSION} to ${TARGET_NAMESPACE}
      
      Source: nv-config-manager (${COMMIT_CONTEXT})
      Triggered by: ${GITLAB_USER_NAME:-CI}
      Pipeline: ${CI_PIPELINE_URL}
      Commit: ${CI_COMMIT_SHA}
      
      Updated image repositories to ${NVCM_IMAGE_REPOSITORY}
      Updated image tags to ${DEPLOY_VERSION} for testing"
      
      git push origin "HEAD:refs/heads/${VALUES_BRANCH}"
      
      echo ""
      echo "✅ Image repositories and tags updated to ${DEPLOY_VERSION} in ${VALUES_FILE_PATH}"
      echo "🚀 ArgoCD will automatically deploy to ${TARGET_NAMESPACE}"
      echo ""
      echo "View changes: https://${CI_SERVER_HOST}/${VALUES_REPO}/-/commits/${VALUES_BRANCH}"
      
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        echo ""
        echo "💡 Test your changes in ${TARGET_NAMESPACE}, then merge when ready!"
      fi


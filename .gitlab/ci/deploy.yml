      fi
      
      echo "📝 Updating image repositories and tags in ${VALUES_FILE_PATH}"
      
      bash "${CI_PROJECT_DIR}/.gitlab/ci/scripts/update_helm_image_values.sh" "${VALUES_FILE_PATH}" "$NVCM_IMAGE_REPOSITORY" "$DEPLOY_VERSION"
      
      # Check if there are changes
      if git diff --quiet ${VALUES_FILE_PATH}; then
        echo "⚠️  No changes to commit - image repositories and tags are already at ${DEPLOY_VERSION}"
        exit 0
      fi
      
      echo "📋 Changes to be committed:"
      git diff ${VALUES_FILE_PATH}
      
      # Build commit message with context
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        COMMIT_CONTEXT="MR !${CI_MERGE_REQUEST_IID}: ${CI_MERGE_REQUEST_TITLE}"
      else
        COMMIT_CONTEXT="Branch: ${CI_COMMIT_REF_NAME}"
      fi
      
      # Commit and push changes
      git add ${VALUES_FILE_PATH}
      git commit -m "[nv-config-manager CI] Deploy ${DEPLOY_VERSION} to ${TARGET_NAMESPACE}
      
      Source: nv-config-manager (${COMMIT_CONTEXT})
      Triggered by: ${GITLAB_USER_NAME:-CI}
      Pipeline: ${CI_PIPELINE_URL}
      Commit: ${CI_COMMIT_SHA}
      
      Updated image repositories to ${NVCM_IMAGE_REPOSITORY}
      Updated image tags to ${DEPLOY_VERSION} for testing"
      
      git push origin "HEAD:refs/heads/${VALUES_BRANCH}"
      
      echo ""
      echo "✅ Image repositories and tags updated to ${DEPLOY_VERSION} in ${VALUES_FILE_PATH}"
      echo "🚀 ArgoCD will automatically deploy to ${TARGET_NAMESPACE}"
      echo ""
      echo "View changes: https://${CI_SERVER_HOST}/${VALUES_REPO}/-/commits/${VALUES_BRANCH}"
      
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        echo ""
        echo "💡 Test your changes in ${TARGET_NAMESPACE}, then merge when ready!"
      fi

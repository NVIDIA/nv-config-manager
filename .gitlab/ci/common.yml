stages:
  - lint
  - build
  - security
  - test
  - sonar
  - deploy
  - release
  # Airgapped bundle stages (manual trigger)
  - prepare-airgapped
  - build-airgapped
  - test-airgapped
  - publish-airgapped

# Run automatic pipelines for merge requests, the default branch, and tags.
# Mirrored feature branches can be deleted upstream while jobs are queued, so
# do not create push pipelines for them. Non-push branch pipelines (for example,
# manual, scheduled, or API-triggered runs) remain available.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Vetted copy-pr-bot refs may run ONLY deliberately triggered pipelines
    # (the test-env promote flow builds untrusted PR code here without
    # secrets). Allow the whitelisted sources, then reject every other source
    # on these refs (schedule, parent_pipeline, push, ...) so the generic
    # branch fallback below cannot admit them.
    - if: $CI_COMMIT_BRANCH =~ /^pull-request\// && ($CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web")
    - if: $CI_COMMIT_BRANCH =~ /^pull-request\//
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_BRANCH
    # Go module tags should not trigger release jobs.
    - if: $CI_COMMIT_TAG =~ /^bindings\/go\/v/
      when: never
    - if: $CI_COMMIT_TAG

variables:
  NVCM_CI_IMAGE_ALPINE: "alpine:3.21"
  NVCM_CI_IMAGE_AWS_CLI: "amazon/aws-cli:latest"
  NVCM_CI_IMAGE_DOCKER: "docker:27"
  NVCM_CI_IMAGE_DOCKER_DIND: "docker:27-dind"
  NVCM_CI_IMAGE_GO: "golang:1.25-alpine"
  NVCM_CI_IMAGE_NODE: "node:24-alpine"
  NVCM_CI_IMAGE_PLAYWRIGHT: "mcr.microsoft.com/playwright:v1.56.1-noble"
  NVCM_CI_IMAGE_PYTHON_311_BOOKWORM: "python:3.11-bookworm"
  NVCM_CI_IMAGE_PYTHON_313: "python:3.13"
  NVCM_CI_IMAGE_SONAR: "sonarsource/sonar-scanner-cli:11"
  NVCM_CI_IMAGE_UBUNTU: "ubuntu:24.04"
  # Images for the untrusted PR build only. Kept separate
  # so a registry override can be scoped to pr-build.yml without
  # moving the ~30 other jobs (including the release path) onto it.
  NVCM_PR_IMAGE_ALPINE: "$NVCM_CI_IMAGE_ALPINE"
  NVCM_PR_IMAGE_DOCKER_DIND: "$NVCM_CI_IMAGE_DOCKER_DIND"
  APT_MIRROR: "$NVCM_APT_MIRROR"
  APT_MIRROR_DEBIAN: "$NVCM_APT_MIRROR_DEBIAN"
  APT_MIRROR_GPG_KEY_URL: "$NVCM_APT_MIRROR_GPG_KEY_URL"

# Always-run job to ensure pipeline has at least one job
# Prevents GitLab UI confusion when all other jobs are skipped
pipeline-status:
  stage: lint
  tags:
    - dca
    - linux/amd64
    - docker
  needs: []
  image: $NVCM_CI_IMAGE_ALPINE
  variables:
    GIT_STRATEGY: empty
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_COMMIT_TAG
      when: always
    - when: never
  script:
    - echo "✅ Pipeline running for commit ${CI_COMMIT_SHORT_SHA}"

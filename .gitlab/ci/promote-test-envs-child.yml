---
# Runnerless environment buttons in the trusted request pipeline create this
# child pipeline. Keeping the child configuration narrow prevents unrelated
# default-branch jobs from running and keeps its result off the main ref status.
stages:
  - deploy

# Keep the child configuration self-contained without importing common.yml,
# whose workflow and full stage list belong to top-level pipelines.
variables:
  NVCM_CI_IMAGE_ALPINE: "alpine:3.21"
  NVCM_CI_IMAGE_DOCKER_DIND: "docker:27-dind"
  NVCM_CI_IMAGE_UBUNTU: "ubuntu:24.04"

include:
  - local: .gitlab/ci/promote-test-envs.yml

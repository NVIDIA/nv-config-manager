# We can't remove volumes in a compose override, for the test configuration using the final containers
# we don't want the volumes so this is the default override file to add the volumes in the dev case
# any override will need to include these volumes to use them.
# see:  https://github.com/docker/compose/issues/3729
---
services:
  nautobot:
    entrypoint: ["/opt/entrypoint.sh"]
    command: ["nautobot-server", "runserver", "0.0.0.0:8080"]
    ports:
      - "8080:8080"
    volumes:
      - "./entrypoint.sh:/opt/entrypoint.sh"
      - "./nautobot_config.py:/opt/nautobot/nautobot_config.py"
      - "../:/source"
      - "nautobot-media:/opt/nautobot/media"
    healthcheck:
      interval: "30s"
      timeout: "30s"
      start_period: "300s"
      retries: 3
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/"]
  docs:
    entrypoint: "mkdocs serve -v -a 0.0.0.0:8080"
    ports:
      - "8001:8080"
    volumes:
      - "../:/source"
    image: "nautobot-app-fabric-partitions/nautobot:${NAUTOBOT_VER}-py${PYTHON_VER}"
    healthcheck:
      disable: true
    tty: true
  worker:
    entrypoint: ["/opt/entrypoint.sh"]
    command:
      - "sh"
      - "-c"
      # $$ because of docker-compose
      - >-
        watchmedo auto-restart --directory './' --pattern '*.py;*.j2'
        --recursive -- nautobot-server celery worker -l $$NAUTOBOT_LOG_LEVEL --events
    volumes:
      - "./entrypoint.sh:/opt/entrypoint.sh"
      - "./nautobot_config.py:/opt/nautobot/nautobot_config.py"
      - "../:/source"
      - "nautobot-media:/opt/nautobot/media"
    healthcheck:
      test: ["CMD", "true"]  # Due to layering, disable: true won't work. Instead, change the test
  beat:
    entrypoint: ["/opt/entrypoint.sh"]
    command:
      - "sh"
      - "-c"
      # $$ because of docker-compose
      - >-
        watchmedo auto-restart --directory './' --pattern '*.py;*.j2'
        --recursive -- nautobot-server celery beat -l $$NAUTOBOT_LOG_LEVEL
    volumes:
      - "./entrypoint.sh:/opt/entrypoint.sh"
      - "./nautobot_config.py:/opt/nautobot/nautobot_config.py"
      - "../:/source"
  db:
    ports:
      - "5432:5432"
      - "3306:3306"
  redis:
    ports:
      - "6379:6379"

volumes:
  nautobot-media:

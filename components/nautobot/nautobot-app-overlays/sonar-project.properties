sonar.projectKey=ngc-cfa_nautobot-app-fabric-partitions
sonar.qualitygate.wait=true

# Python version for more precise analysis
sonar.python.version=3.11, 3.12

# Python coverage report (generated by pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml

# Exclude migrations and tests from analysis
sonar.exclusions=**/migrations/**,**/tests/**

# Reduce duplication detection for intentionally repetitive code
sonar.cpd.exclusions=**/tests/**/*

name: Public CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NAUTOBOT_PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"
  KIND_VERSION: "v0.25.0"
  HELM_VERSION: "v3.15.3"

jobs:
  python-lint:
    name: Python Lint And Types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check src/ components/network-templates/src components/network-templates/tests
      - run: uv run ruff check src/ components/network-templates/src components/network-templates/tests
      - run: uv run ty check src/nv_config_manager/
      - run: uv run mypy src/nv_config_manager --no-incremental
      - name: Installer lint
        working-directory: installer
        run: |
          uv sync --frozen
          uv run ruff format --check src/
          uv run ruff check src/
      - name: Nautobot lint
        working-directory: components/nautobot
        run: |
          uv sync --frozen
          uv run ruff format --check nv_config_manager_auth nv_config_manager_jobs nautobot_config.py
          uv run ruff check nv_config_manager_auth nv_config_manager_jobs nautobot_config.py

  nautobot-app-overlays:
    name: Nautobot Overlays Lint And Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.NAUTOBOT_PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Lint and build app package
        working-directory: components/nautobot/nautobot-app-overlays
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0+ci"
        run: |
          uv sync --all-extras --dev
          uv run ruff format --check nautobot_app_overlays tasks.py
          uv run ruff check nautobot_app_overlays tasks.py
          uv build --out-dir dist --clear

  nautobot-nv-config-manager:
    name: Nautobot NV Config Manager Lint And Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.NAUTOBOT_PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Lint and build app package
        working-directory: components/nautobot/nautobot-nv-config-manager
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0+ci"
        run: |
          uv sync --all-extras --dev
          uv run ruff format --check nv_config_manager
          uv run ruff check nv_config_manager
          uv build --out-dir dist --clear

  spdx:
    name: SPDX Headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check source headers
        run: |
          SPDX_ID="SPDX-License-Identifier: Apache-2.0"
          LICENSE_TEXT="Licensed under the Apache License"
          CHECK_DIRS="src/ ui/src/ ui/tests/ components/ db/migrations/ scripts/ development/ installer/src/"
          EXTENSIONS="py ts tsx go"
          FAILED=0
          for dir in $CHECK_DIRS; do
            if [ ! -d "$dir" ]; then continue; fi
            for ext in $EXTENSIONS; do
              while IFS= read -r file; do
                if [ ! -s "$file" ]; then continue; fi
                if ! head -n 20 "$file" | grep -q "$SPDX_ID" || ! head -n 20 "$file" | grep -q "$LICENSE_TEXT"; then
                  echo "Missing full SPDX header: $file"
                  FAILED=1
                fi
              done < <(find "$dir" -name "*.$ext" -not -path '*__pycache__*' -not -path '*node_modules*' -not -path '*.git*')
            done
          done
          exit "$FAILED"

  python-tests:
    name: Python Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -n auto --cov=src/nv_config_manager --cov-report=xml:coverage.xml --cov-report=term
      - name: Nautobot tests
        working-directory: components/nautobot
        run: |
          uv sync --frozen
          uv run pytest tests/ -n auto --cov=nv_config_manager_auth --cov=nv_config_manager_jobs --cov-report=xml:coverage.xml --cov-report=term
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-artifacts
          path: |
            coverage.xml
            components/nautobot/coverage.xml

  installer-tests:
    name: Installer Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Test installer
        working-directory: installer
        run: |
          uv sync --frozen
          uv run pytest tests/ -v --cov=src/nv_config_manager_installer --cov-report=xml:coverage.xml --cov-report=term
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-test-artifacts
          path: installer/coverage.xml

  network-template-tests:
    name: Network Template Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest components/network-templates/tests -v --cov=nv_config_manager_templates --cov-report=xml:components/network-templates/coverage.xml --cov-report=term
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-template-test-artifacts
          path: components/network-templates/coverage.xml

  go-lint:
    name: Go Module Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: components/nats-ready/go.mod
          cache-dependency-path: components/nats-ready/go.sum
      - name: Verify go.mod is tidy
        working-directory: components/nats-ready
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  helm:
    name: Helm Lint And Template
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        run: |
          curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
      - name: Build chart dependencies
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update
          helm dependency build deploy/helm/
      - run: helm lint deploy/helm/ --values deploy/helm/values-ci.yaml
      - run: helm template test deploy/helm/ --values deploy/helm/values-ci.yaml >/tmp/nvcm-helm.yaml

  openapi:
    name: OpenAPI Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python scripts/generate_openapi.py --check

  ui:
    name: UI Lint Build And E2E
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-e2e-artifacts
          path: |
            ui/playwright-report/
            ui/test-results/

  integration:
    name: Kind Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      KIND_CLUSTER_NAME: nv-config-manager
      NV_CONFIG_MANAGER_NAMESPACE: nv-config-manager
      NV_CONFIG_MANAGER_HOSTNAME: config-manager.local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl jq rsync ca-certificates gnupg make

          curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" -o kind
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

          curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz
          sudo mv linux-amd64/helm /usr/local/bin/helm

          curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL "https://dl.k8s.io/release/$(curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

          curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64 -o yq
          chmod +x yq
          sudo mv yq /usr/local/bin/yq

          docker info
      - name: Install Python dependencies
        run: |
          uv sync --frozen
          cd installer
          uv sync --frozen
      - name: Configure hostnames
        run: |
          HOSTS="config-manager.local nautobot.config-manager.local render.config-manager.local ztp.config-manager.local dhcp.config-manager.local workflow.config-manager.local temporal.config-manager.local config-store.config-manager.local svc-workflow.config-manager.local svc-render.config-manager.local svc-ztp.config-manager.local svc-dhcp.config-manager.local svc-nautobot.config-manager.local svc-config-store.config-manager.local"
          echo "127.0.0.1 ${HOSTS}" | sudo tee -a /etc/hosts
      - name: Deploy to Kind
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=512
          sudo sysctl -w fs.inotify.max_user_watches=524288
          make kind-up \
            KIND_CLUSTER_NAME="${KIND_CLUSTER_NAME}" \
            INSTALL_CONFIG=deploy/configs/ci-integration-test.yaml \
            HELM_TIMEOUT=20m
          kubectl get pods -n "${NV_CONFIG_MANAGER_NAMESPACE}" -o wide
      - name: Run integration tests
        run: |
          for attempt in 1 2 3; do
            echo "Attempt ${attempt} of 3"
            if uv run pytest src/tests/integration/ -v \
              --ci \
              --nv-config-manager-namespace "${NV_CONFIG_MANAGER_NAMESPACE}" \
              --tb=short \
              --junitxml=integration-test-results.xml; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep 10
            fi
          done
          exit 1
      - name: Collect integration logs
        if: always()
        run: |
          mkdir -p integration-test-logs
          kubectl get pods -n "${NV_CONFIG_MANAGER_NAMESPACE}" -o wide > integration-test-logs/pods.txt 2>&1 || true
          kubectl get events -n "${NV_CONFIG_MANAGER_NAMESPACE}" --sort-by='.lastTimestamp' > integration-test-logs/events.txt 2>&1 || true
          for pod in $(kubectl get pods -n "${NV_CONFIG_MANAGER_NAMESPACE}" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            kubectl logs -n "${NV_CONFIG_MANAGER_NAMESPACE}" "$pod" --all-containers > "integration-test-logs/${pod}.log" 2>&1 || true
          done
      - name: Delete Kind cluster
        if: always()
        run: kind delete cluster --name "${KIND_CLUSTER_NAME}" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-artifacts
          path: |
            integration-test-logs/
            integration-test-results.xml

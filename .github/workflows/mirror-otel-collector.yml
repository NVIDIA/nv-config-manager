# Mirror opentelemetry-collector-contrib from Docker Hub to nvcr.io/nvidian/gni/
#
# Run this manually whenever you need to pin a new collector tag.
# Auth flow mirrors GNINWD-1599's GitLab-JWT pattern, adapted for GitHub OIDC:
#   GitHub OIDC token → Vault auth/github_actions/login → nvcr registry-token → crane copy
#
# Prerequisites (one-time Vault IaC — see LLD §5.2):
#   1. A Vault JWT role `ci-nv-config-manager-image-mirror` bound to this repository's
#      GitHub OIDC claims (bound_claims: repository = "NVIDIA/nv-config-manager"),
#      audience https://prod.vault.nvidia.com, backend_path = "github_actions".
#   2. A policy granting read on:
#      ngc/secrets/+/groups/ngc-gni-netdev/nvcr/registry-token
#   (Analogous to vault-ngc-iac MR !787 created for GNINWD-1599.)

name: Mirror OTel Collector Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "opentelemetry-collector-contrib tag to mirror (e.g. 0.124.1)"
        required: true
        default: "0.124.1"
        type: string

permissions:
  contents: read
  id-token: write  # Required to mint the GitHub OIDC token for Vault auth

env:
  SOURCE_IMAGE: "docker.io/otel/opentelemetry-collector-contrib"
  DEST_IMAGE: "nvcr.io/nvidian/gni/opentelemetry-collector-contrib"
  VAULT_ADDR: "https://prod.vault.nvidia.com"
  VAULT_NAMESPACE: "ngc"
  CRANE_VERSION: "v0.20.3"

jobs:
  mirror:
    name: "Mirror ${{ inputs.tag }}"
    runs-on: linux-amd64-cpu4
    steps:
      - name: Setup proxy cache
        uses: nv-gha-runners/setup-proxy-cache@14229018fe157c83e03c008f27d183d8e99bc67c

      - name: Fetch nvcr registry token from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ env.VAULT_ADDR }}
          namespace: ${{ env.VAULT_NAMESPACE }}
          method: jwt
          # Confirm the exact backend path with the Vault / infra team.
          # GitLab uses "gitlab"; the GitHub Actions OIDC backend is typically "github_actions".
          path: github_actions
          role: ci-nv-config-manager-image-mirror
          jwtGithubAudience: ${{ env.VAULT_ADDR }}
          secrets: |
            ngc/secrets/groups/ngc-gni-netdev/nvcr/registry-token token | NVCR_TOKEN

      - name: Install crane
        run: |
          curl -sSfL \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xz crane
          sudo mv crane /usr/local/bin/crane
          crane version

      - name: Login to nvcr.io
        run: |
          echo "${NVCR_TOKEN}" \
            | crane auth login nvcr.io --username '$oauthtoken' --password-stdin

      - name: Mirror image
        run: |
          crane copy "${SOURCE_IMAGE}:${{ inputs.tag }}" "${DEST_IMAGE}:${{ inputs.tag }}"

      - name: Verify digest matches source
        run: |
          SRC_DIGEST=$(crane digest "${SOURCE_IMAGE}:${{ inputs.tag }}")
          DST_DIGEST=$(crane digest "${DEST_IMAGE}:${{ inputs.tag }}")
          echo "source:      ${SRC_DIGEST}"
          echo "destination: ${DST_DIGEST}"
          if [ "${SRC_DIGEST}" != "${DST_DIGEST}" ]; then
            echo "ERROR: digest mismatch after copy" >&2
            exit 1
          fi
          echo "Digest verified: ${SRC_DIGEST}"

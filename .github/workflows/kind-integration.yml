name: Kind Integration

on:
  workflow_dispatch:
    inputs:
      test_path:
        description: Pytest path to run
        required: true
        default: src/tests/integration/
        type: string
      observability:
        description: Deploy the observability stack (Prometheus + Alloy) and run observability tests
        required: false
        default: false
        type: boolean
      approved_sha:
        description: Exact PR commit set by /kind test; leave blank for manual runs
        required: false
        default: ""
        type: string

concurrency:
  group: kind-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  KIND_VERSION: "v0.25.0"
  HELM_VERSION: "v3.15.3"
  KUBECTL_VERSION: "v1.31.0"
  YQ_VERSION: "v4.44.1"
  KIND_SHA256: "b22ff7e5c02b8011e82cc3223d069d178b9e1543f1deb21e936d11764780a3d8"
  HELM_SHA256: "ad871aecb0c9fd96aa6702f6b79e87556c8998c2e714a4959bf71ee31282ac9c"
  KUBECTL_SHA256: "7c27adc64a84d1c0cc3dcf7bf4b6e916cc00f3f576a2dbac51b318d926032437"
  YQ_SHA256: "6dc2d0cd4e0caca5aeffd0d784a48263591080e4a0895abe69f3a76eb50d1ba3"

jobs:
  integration:
    name: Kind Integration
    if: startsWith(github.ref, 'refs/heads/pull-request/')
    runs-on: linux-amd64-cpu32m
    permissions:
      contents: read
    timeout-minutes: 90
    env:
      KIND_CLUSTER_NAME: nv-config-manager-${{ github.run_id }}
      NV_CONFIG_MANAGER_NAMESPACE: nv-config-manager
      NV_CONFIG_MANAGER_HOSTNAME: config-manager.local
      TEST_PATH: ${{ inputs.test_path }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Verify approved commit
        if: inputs.approved_sha != ''
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "${actual_sha}" != "${APPROVED_SHA}" ]; then
            echo "Expected approved commit ${APPROVED_SHA}, checked out ${actual_sha}"
            exit 1
          fi
      - name: Setup proxy cache
        timeout-minutes: 5
        uses: nv-gha-runners/setup-proxy-cache@14229018fe157c83e03c008f27d183d8e99bc67c
        with:
          enable-apt: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        timeout-minutes: 5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        timeout-minutes: 5
        with:
          enable-cache: true
      - name: Set up Docker Buildx
        id: buildx
        timeout-minutes: 5
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          buildkitd-config: /etc/buildkit/buildkitd.toml
      - name: Install tools
        timeout-minutes: 15
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl jq rsync ca-certificates gnupg make

          curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" -o kind-linux-amd64
          echo "${KIND_SHA256}  kind-linux-amd64" | sha256sum -c -
          chmod +x kind-linux-amd64
          sudo mv kind-linux-amd64 /usr/local/bin/kind

          curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o "helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm-${HELM_VERSION}-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf "helm-${HELM_VERSION}-linux-amd64.tar.gz"
          sudo mv linux-amd64/helm /usr/local/bin/helm

          curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o kubectl
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum -c -
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

          curl --retry 3 --retry-delay 5 --retry-connrefused -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o yq
          echo "${YQ_SHA256}  yq" | sha256sum -c -
          chmod +x yq
          sudo mv yq /usr/local/bin/yq

          docker info
      - name: Install Python dependencies
        timeout-minutes: 15
        run: |
          uv sync --frozen
          cd installer
          uv sync --frozen
      - name: Configure hostnames
        timeout-minutes: 2
        run: |
          HOSTS="config-manager.local nautobot.config-manager.local render.config-manager.local ztp.config-manager.local dhcp.config-manager.local workflow.config-manager.local temporal.config-manager.local config-store.config-manager.local svc-workflow.config-manager.local svc-render.config-manager.local svc-ztp.config-manager.local svc-dhcp.config-manager.local svc-nautobot.config-manager.local svc-config-store.config-manager.local"
          echo "127.0.0.1 ${HOSTS}" | sudo tee -a /etc/hosts
      - name: Deploy to Kind
        timeout-minutes: 65
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          OBSERVABILITY: ${{ inputs.observability }}
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=512
          sudo sysctl -w fs.inotify.max_user_watches=524288

          # Opt-in observability: flip the two monitoring switches on the base
          # config in place (the runner checkout is throwaway, so we keep a
          # single source of truth instead of a near-duplicate config file).
          # This installs the prometheus-operator CRDs + standalone
          # Prometheus/Alloy and enables monitoring.probes, so the Probe CRs
          # render with the SLO customLabels from values-observability.yaml.
          # Defaults off so normal kind runs stay fast.
          #
          # We also append the observability stack's runtime images to
          # kind_preload_images. The installer preloads these on the host (which
          # goes through the runner proxy cache) and `kind load`s them, so
          # helm's --wait doesn't stall on anonymous in-cluster pulls from
          # quay.io / docker.io — those uncached pulls are what blow the deploy
          # timeout. Keep the tags in sync with the prometheus (Chart.yaml) and
          # alloy subchart versions; derive current refs with:
          #   helm template t deploy/helm -f deploy/helm/values-ci.yaml \
          #     -f deploy/helm/values-observability.yaml | grep -E 'image:'
          if [ "${OBSERVABILITY}" = "true" ]; then
            echo "Observability enabled for this run"
            yq -i '
              .infrastructure.monitoring.enabled = true |
              .infrastructure.monitoring.observability_enabled = true |
              .images.kind_preload_images += [
                "quay.io/prometheus/prometheus:v3.11.3",
                "quay.io/prometheus-operator/prometheus-config-reloader:v0.90.1",
                "docker.io/grafana/alloy:v1.16.0"
              ]
            ' deploy/configs/ci-integration-test.yaml
          fi

          make kind-up \
            KIND_CLUSTER_NAME="${KIND_CLUSTER_NAME}" \
            INSTALL_CONFIG=deploy/configs/ci-integration-test.yaml \
            HELM_TIMEOUT=20m

          kind_ca_bundle="${RUNNER_TEMP}/nvcm-kind-ca-bundle.crt"
          cp "${REQUESTS_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}" "${kind_ca_bundle}"
          printf '\n' >>"${kind_ca_bundle}"
          kubectl get secret -n "${NV_CONFIG_MANAGER_NAMESPACE}" nv-config-manager-gateway-tls \
            -o jsonpath='{.data.tls\.crt}' | base64 --decode >>"${kind_ca_bundle}"
          echo "REQUESTS_CA_BUNDLE=${kind_ca_bundle}" >>"${GITHUB_ENV}"

          kubectl get pods -n "${NV_CONFIG_MANAGER_NAMESPACE}" -o wide
      - name: Run integration tests
        timeout-minutes: 50
        env:
          # Gates observability-only tests (e.g. test_probe_labels.py), which
          # skip themselves unless this is "true". Mirrors the JIRA_ISSUE_KEY
          # gate on the diagnostics tests.
          OBSERVABILITY: ${{ inputs.observability }}
        run: |
          for attempt in 1 2 3; do
            echo "Attempt ${attempt} of 3"
            results_file="integration-test-results-${attempt}.xml"
            set +e
            timeout --kill-after=1m 15m uv run pytest "${TEST_PATH}" -v \
              --ci \
              --nv-config-manager-namespace "${NV_CONFIG_MANAGER_NAMESPACE}" \
              --tb=short \
              --junitxml="${results_file}"
            test_status=$?
            set -e

            if [ "${test_status}" -eq 0 ]; then
              cp -f "${results_file}" integration-test-results.xml
              exit 0
            fi

            if [ -f "${results_file}" ]; then
              cp -f "${results_file}" integration-test-results.xml
            fi

            if [ "${test_status}" -eq 124 ] || \
              { [ "${test_status}" -ge 128 ] && [ "${test_status}" -le 192 ]; }; then
              echo "Attempt ${attempt} failed with retryable status ${test_status}"
              if [ "${attempt}" -lt 3 ]; then
                sleep 10
                continue
              fi
              exit "${test_status}"
            else
              echo "Attempt ${attempt} failed with non-retryable status ${test_status}"
              exit "${test_status}"
            fi
          done
          exit 1
      - name: Collect integration logs
        if: always()
        timeout-minutes: 10
        run: |
          mkdir -p integration-test-logs
          kubectl get pods -n "${NV_CONFIG_MANAGER_NAMESPACE}" -o wide > integration-test-logs/pods.txt 2>&1 || true
          kubectl get events -n "${NV_CONFIG_MANAGER_NAMESPACE}" --sort-by='.lastTimestamp' > integration-test-logs/events.txt 2>&1 || true
          for pod in $(kubectl get pods -n "${NV_CONFIG_MANAGER_NAMESPACE}" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            kubectl logs -n "${NV_CONFIG_MANAGER_NAMESPACE}" "$pod" --all-containers > "integration-test-logs/${pod}.log" 2>&1 || true
          done
      - name: Delete Kind cluster
        if: always()
        timeout-minutes: 5
        run: kind delete cluster --name "${KIND_CLUSTER_NAME}" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 5
        with:
          name: integration-test-artifacts
          path: |
            integration-test-logs/
            integration-test-results.xml

  report-result:
    name: Report Kind Integration Result
    needs: integration
    if: always() && startsWith(github.ref, 'refs/heads/pull-request/')
    runs-on: linux-amd64-cpu4
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The slash-command dispatcher uses GITHUB_TOKEN, so a follow-on
      # workflow_run event is not reliable. Report from the dispatched workflow
      # instead, using the same approved pull-request/* SHA that Kind tested.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Update PR with result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        timeout-minutes: 5
        env:
          KIND_RESULT_CONCLUSION: ${{ needs.integration.result }}
          KIND_RESULT_EVENT: ${{ github.event_name }}
          KIND_RESULT_HEAD_BRANCH: ${{ github.ref_name }}
          KIND_RESULT_HEAD_SHA: ${{ github.sha }}
          KIND_RESULT_HTML_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const report = require("./.github/scripts/kind-integration-result.js");
            await report({
              github,
              context,
              core,
              run: {
                conclusion: process.env.KIND_RESULT_CONCLUSION,
                event: process.env.KIND_RESULT_EVENT,
                head_branch: process.env.KIND_RESULT_HEAD_BRANCH,
                head_sha: process.env.KIND_RESULT_HEAD_SHA,
                html_url: process.env.KIND_RESULT_HTML_URL,
                status: "completed",
              },
            });

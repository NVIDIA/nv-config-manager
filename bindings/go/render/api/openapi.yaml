openapi: 3.1.0
info:
  title: Render API
  version: 0.1.0
servers:
- url: /
paths:
  /healthcheck:
    get:
      description: Execute healthcheck.
      operationId: healthcheck_healthcheck_get
      responses:
        "200":
          content:
            application/json:
              schema:
                title: Response Healthcheck Healthcheck Get
                type: string
          description: Successful Response
      summary: Healthcheck
  /v1/admin/consumers:
    get:
      description: List all consumers and their current status.
      operationId: list_consumers_v1_admin_consumers_get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerListResponse"
          description: Operation successful
        "404":
          description: Consumer not found
        "500":
          description: Internal server error
      summary: List Consumers
      tags:
      - admin
  /v1/admin/consumers/reset-all:
    delete:
      description: Reset all consumers by deleting them. Consumers will be automatically
        recreated within seconds by the running services.
      operationId: reset_all_consumers_v1_admin_consumers_reset_all_delete
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ConsumerResetResponse"
                title: Response Reset All Consumers V1 Admin Consumers Reset All Delete
                type: array
          description: Operation successful
        "404":
          description: Consumer not found
        "500":
          description: Internal server error
      summary: Reset All Consumers
      tags:
      - admin
  /v1/admin/consumers/{consumer_type}:
    get:
      description: Get detailed information about a specific consumer.
      operationId: get_consumer_info_v1_admin_consumers__consumer_type__get
      parameters:
      - explode: false
        in: path
        name: consumer_type
        required: true
        schema:
          $ref: "#/components/schemas/ConsumerType"
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerInfo"
          description: Operation successful
        "404":
          description: Consumer not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
        "500":
          description: Internal server error
      summary: Get Consumer Info
      tags:
      - admin
  /v1/admin/consumers/{consumer_type}/reset:
    delete:
      description: Reset a consumer by deleting it. The consumer will be automatically
        recreated within seconds by the running service.
      operationId: reset_consumer_v1_admin_consumers__consumer_type__reset_delete
      parameters:
      - explode: false
        in: path
        name: consumer_type
        required: true
        schema:
          $ref: "#/components/schemas/ConsumerType"
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerResetResponse"
          description: Operation successful
        "404":
          description: Consumer not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
        "500":
          description: Internal server error
      summary: Reset Consumer
      tags:
      - admin
  /v1/render/all:
    post:
      description: Queue renders for all render-enabled devices.
      operationId: render_all_v1_render_all_post
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: "#/components/schemas/RenderRequest"
              nullable: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkRenderResponse"
          description: Render produced no diff
        "201":
          description: Successfully rendered a new configuration version
        "202":
          description: Successfully queued renders for all devices
        "404":
          description: Not found
        "409":
          description: Could not acquire lock within timeout
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Render All
      tags:
      - render
  /v1/render/batch:
    post:
      description: Queue renders for a specific list of devices with optimized batch
        processing.
      operationId: render_batch_v1_render_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRenderRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkRenderResponse"
          description: Render produced no diff
        "201":
          description: Successfully rendered a new configuration version
        "202":
          description: Successfully queued renders for all devices
        "404":
          description: Not found
        "409":
          description: Could not acquire lock within timeout
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Render Batch
      tags:
      - render
  /v1/render/{device_uuid}/render:
    post:
      description: Perform a fresh render for a device.
      operationId: render_v1_render__device_uuid__render_post
      parameters:
      - explode: false
        in: path
        name: device_uuid
        required: true
        schema:
          title: Device Uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: "#/components/schemas/RenderRequest"
              nullable: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderResponse"
          description: Render produced no diff
        "201":
          description: Successfully rendered a new configuration version
        "202":
          description: Successfully queued renders for all devices
        "404":
          description: Not found
        "409":
          description: Could not acquire lock within timeout
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Render
      tags:
      - render
  /whoami:
    get:
      description: Reflect the caller's identity as seen by this service.
      operationId: whoami_whoami_get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoamiResponse"
          description: Successful Response
      summary: Current User Info
components:
  schemas:
    BatchRenderRequest:
      description: Request body for a batch render operation.
      example:
        max_concurrency: 0
        device_uuids:
        - device_uuids
        - device_uuids
        commit_message: commit_message
      properties:
        commit_message:
          nullable: true
          type: string
        device_uuids:
          items:
            type: string
          title: Device Uuids
          type: array
        max_concurrency:
          default: 20
          title: Max Concurrency
          type: integer
      required:
      - device_uuids
      title: BatchRenderRequest
    BulkRenderResponse:
      description: Response from a bulk render operation (render-all or batch).
      example:
        max_concurrency: 0
        failed_devices:
        - error: error
          device_uuid: device_uuid
        - error: error
          device_uuid: device_uuid
        total_devices: 1
        queued_count: 6
        message: message
      properties:
        failed_devices:
          items:
            $ref: "#/components/schemas/FailedDevice"
          nullable: true
          type: array
        max_concurrency:
          nullable: true
          type: integer
        message:
          title: Message
          type: string
        queued_count:
          title: Queued Count
          type: integer
        total_devices:
          default: 0
          description: Total number of devices targeted
          title: Total Devices
          type: integer
      required:
      - message
      - queued_count
      title: BulkRenderResponse
    ConsumerInfo:
      description: Consumer information model.
      example:
        stream: stream
        num_pending: 1
        subject: subject
        num_delivered: 6
        name: name
        num_ack_pending: 0
      properties:
        name:
          title: Name
          type: string
        num_ack_pending:
          title: Num Ack Pending
          type: integer
        num_delivered:
          title: Num Delivered
          type: integer
        num_pending:
          title: Num Pending
          type: integer
        stream:
          title: Stream
          type: string
        subject:
          title: Subject
          type: string
      required:
      - name
      - num_ack_pending
      - num_delivered
      - num_pending
      - stream
      - subject
      title: ConsumerInfo
    ConsumerListResponse:
      description: Consumer list response model.
      example:
        consumers:
        - stream: stream
          num_pending: 1
          subject: subject
          num_delivered: 6
          name: name
          num_ack_pending: 0
        - stream: stream
          num_pending: 1
          subject: subject
          num_delivered: 6
          name: name
          num_ack_pending: 0
      properties:
        consumers:
          items:
            $ref: "#/components/schemas/ConsumerInfo"
          title: Consumers
          type: array
      required:
      - consumers
      title: ConsumerListResponse
    ConsumerResetResponse:
      description: Consumer reset response model.
      example:
        consumer_name: consumer_name
        stream: stream
        message: message
        status: status
      properties:
        consumer_name:
          title: Consumer Name
          type: string
        message:
          title: Message
          type: string
        status:
          title: Status
          type: string
        stream:
          title: Stream
          type: string
      required:
      - consumer_name
      - message
      - status
      - stream
      title: ConsumerResetResponse
    ConsumerType:
      description: Valid consumer types for NATS consumer management.
      enum:
      - nautobot
      - device
      - template
      title: ConsumerType
      type: string
    FailedDevice:
      description: A device that failed to queue for rendering.
      example:
        error: error
        device_uuid: device_uuid
      properties:
        device_uuid:
          title: Device Uuid
          type: string
        error:
          title: Error
          type: string
      required:
      - device_uuid
      - error
      title: FailedDevice
    FileCommit:
      description: A rendered file and the config store commit it produced.
      example:
        filename: filename
        commit: commit
      properties:
        commit:
          title: Commit
          type: string
        filename:
          title: Filename
          type: string
      required:
      - commit
      - filename
      title: FileCommit
    HTTPValidationError:
      example:
        detail:
        - msg: msg
          input: ""
          loc:
          - Location_inner
          - Location_inner
          ctx: "{}"
          type: type
        - msg: msg
          input: ""
          loc:
          - Location_inner
          - Location_inner
          ctx: "{}"
          type: type
      properties:
        detail:
          items:
            $ref: "#/components/schemas/ValidationError"
          title: Detail
          type: array
      title: HTTPValidationError
    RenderRequest:
      description: Request body for a render operation.
      example:
        commit_message: commit_message
      properties:
        commit_message:
          nullable: true
          type: string
      title: RenderRequest
    RenderResponse:
      description: Response from a single device render operation.
      example:
        updated_files:
        - filename: filename
          commit: commit
        - filename: filename
          commit: commit
      properties:
        updated_files:
          description: Files that changed during the render
          items:
            $ref: "#/components/schemas/FileCommit"
          title: Updated Files
          type: array
      title: RenderResponse
    ValidationError:
      example:
        msg: msg
        input: ""
        loc:
        - Location_inner
        - Location_inner
        ctx: "{}"
        type: type
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            $ref: "#/components/schemas/Location_inner"
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WhoamiResponse:
      description: Response shape for ``GET /whoami``.
      example:
        roles:
        - roles
        - roles
        user: user
      properties:
        roles:
          items:
            type: string
          title: Roles
          type: array
        user:
          title: User
          type: string
      required:
      - roles
      - user
      title: WhoamiResponse
    Location_inner:
      anyOf:
      - type: string
      - type: integer

openapi: 3.1.0
info:
  title: Temporal Workflow API
  version: 0.1.0
servers:
- url: /
paths:
  /healthcheck:
    get:
      description: Execute healthcheck.
      operationId: healthcheck_healthcheck_get
      responses:
        "200":
          content:
            application/json:
              schema:
                enum:
                - OK
                title: Response Healthcheck Healthcheck Get
                type: string
          description: Successful Response
      summary: Healthcheck
  /rbac-config-status:
    get:
      description: Check the status of the RBAC configuration and return the mapping.
      operationId: rbac_config_status_rbac_config_status_get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RBACConfigResponse"
          description: Successful Response
      summary: RBAC Config Status
  /v1/codec/decode:
    post:
      description: Decode (decompress) payloads for Temporal Web UI display.
      operationId: decode_v1_codec_decode_post
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                title: Response Decode V1 Codec Decode Post
          description: Successful Response
      summary: Decode payloads
      tags:
      - codec
  /v1/codec/encode:
    post:
      description: Encode (compress) payloads for Temporal Web UI when editing.
      operationId: encode_v1_codec_encode_post
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                title: Response Encode V1 Codec Encode Post
          description: Successful Response
      summary: Encode payloads
      tags:
      - codec
  /v1/parameter/device:
    get:
      description: Return a list of filtered devices.
      operationId: get_devices_v1_parameter_device_get
      parameters:
      - explode: true
        in: query
        name: site
        required: false
        schema:
          items:
            nullable: true
            type: string
          nullable: true
          type: array
        style: form
      - explode: true
        in: query
        name: status
        required: false
        schema:
          items:
            type: string
          nullable: true
          type: array
        style: form
      - explode: true
        in: query
        name: role
        required: false
        schema:
          items:
            type: string
          nullable: true
          type: array
        style: form
      - explode: true
        in: query
        name: tenant
        required: false
        schema:
          items:
            type: string
          nullable: true
          type: array
        style: form
      - explode: true
        in: query
        name: device_type_id
        required: false
        schema:
          items:
            type: string
          nullable: true
          type: array
        style: form
      - explode: true
        in: query
        name: manufacturer
        required: false
        schema:
          items:
            type: string
          nullable: true
          type: array
        style: form
      - explode: true
        in: query
        name: platform
        required: false
        schema:
          items:
            type: string
          nullable: true
          type: array
        style: form
      - description: Limit to NVIDIA Config Manager-managed devices
        explode: true
        in: query
        name: managed_only
        required: false
        schema:
          default: false
          description: Limit to NVIDIA Config Manager-managed devices
          title: Managed Only
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Device"
                title: Response Get Devices V1 Parameter Device Get
                type: array
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Devices
      tags:
      - parameters
  /v1/parameter/device-id:
    get:
      description: |-
        Convert device hostname to device ID.

        Args:
            device_name: The hostname/name of the device.

        Returns:
            Device object with id and name.

        Raises:
            HTTPException: If device not found or multiple devices match.
      operationId: get_device_id_by_name_v1_parameter_device_id_get
      parameters:
      - explode: true
        in: query
        name: device_name
        required: true
        schema:
          title: Device Name
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Device ID by Name
      tags:
      - parameters
  /v1/parameter/device/{device_id}/password_users:
    get:
      description: |-
        Get available password users from device config context password_mappings.

        Args:
            device_id: The UUID of the device.

        Returns:
            List of password users with their secret names from password_mappings.
      operationId: get_device_password_users_v1_parameter_device__device_id__password_users_get
      parameters:
      - explode: false
        in: path
        name: device_id
        required: true
        schema:
          title: Device Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Secret"
                title: Response Get Device Password Users V1 Parameter Device  Device
                  Id  Password Users Get
                type: array
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Device Password Users
      tags:
      - parameters
  /v1/parameter/device/{device_id}/secret_types:
    get:
      description: |-
        Get available secret types from device config context.

        Args: device_id: The UUID of the device.

        Returns:
            List of secret types plus versions from config context.
      operationId: get_device_users_with_versions_v1_parameter_device__device_id__secret_types_get
      parameters:
      - explode: false
        in: path
        name: device_id
        required: true
        schema:
          title: Device Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  nullable: true
                  type: string
                title: Response Get Device Users With Versions V1 Parameter Device  Device
                  Id  Secret Types Get
                type: array
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Secret Types for Device
      tags:
      - parameters
  /v1/parameter/device/{device_id}/secrets:
    get:
      description: |-
        Return a list of secrets available in device config context.

        Args:
            device_id: The UUID of the device to fetch secrets from

        Returns:
            List of secrets found in the device's config context
      operationId: get_device_secrets_v1_parameter_device__device_id__secrets_get
      parameters:
      - explode: false
        in: path
        name: device_id
        required: true
        schema:
          title: Device Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Secret"
                title: Response Get Device Secrets V1 Parameter Device  Device Id  Secrets
                  Get
                type: array
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Device Secrets
      tags:
      - parameters
  /v1/parameter/diagnostics/commands:
    get:
      description: |-
        Return the diagnostics command catalog for the requested platform(s).

        Pass one or more ``?platform=<slug>`` query params (e.g. ``cumulus-linux``).
        When no platform is given, commands from all platforms are returned.
        Commands that appear on multiple platforms are deduplicated by name.
      operationId: get_diagnostics_commands_v1_parameter_diagnostics_commands_get
      parameters:
      - explode: true
        in: query
        name: platform
        required: false
        schema:
          items:
            type: string
          nullable: true
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/CommandEntry"
                title: Response Get Diagnostics Commands V1 Parameter Diagnostics
                  Commands Get
                type: array
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Diagnostics Commands
      tags:
      - parameters
  /v1/parameter/location:
    get:
      description: Return a list of NVIDIA Config Manager-managed sites.
      operationId: get_locations_v1_parameter_location_get
      parameters:
      - explode: true
        in: query
        name: location_type
        required: false
        schema:
          items:
            type: string
          nullable: true
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Location"
                title: Response Get Locations V1 Parameter Location Get
                type: array
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Locations
      tags:
      - parameters
  /v1/parameter/namespace-tag:
    get:
      description: Return a list of tags used by Nautobot namespaces.
      operationId: get_namespace_tags_v1_parameter_namespace_tag_get
      parameters:
      - description: Limit to namespace tags at this location
        explode: true
        in: query
        name: location
        required: false
        schema:
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Tag"
                title: Response Get Namespace Tags V1 Parameter Namespace Tag Get
                type: array
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Namespace Tags
      tags:
      - parameters
  /v1/parameter/role:
    get:
      description: "Return a list of roles. Default: all. With managed_only=true:\
        \ only those with managed devices."
      operationId: get_roles_v1_parameter_role_get
      parameters:
      - description: Limit to roles with managed devices
        explode: true
        in: query
        name: managed_only
        required: false
        schema:
          default: false
          description: Limit to roles with managed devices
          title: Managed Only
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Role"
                title: Response Get Roles V1 Parameter Role Get
                type: array
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Roles
      tags:
      - parameters
  /v1/parameter/site:
    get:
      description: Return a list of NVIDIA Config Manager-managed sites.
      operationId: get_sites_v1_parameter_site_get
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Location"
                title: Response Get Sites V1 Parameter Site Get
                type: array
          description: Successful Response
      summary: Get Sites
      tags:
      - parameters
  /v1/parameter/status:
    get:
      description: Return a list of statuses. Optional content_type filters to that
        object type.
      operationId: get_statuses_v1_parameter_status_get
      parameters:
      - description: "Filter by content type (e.g. dcim.device, circuits.circuit)"
        explode: true
        in: query
        name: content_type
        required: false
        schema:
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Status"
                title: Response Get Statuses V1 Parameter Status Get
                type: array
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Statuses
      tags:
      - parameters
  /v1/parameter/tenant:
    get:
      description: "Return a list of tenants. Default: all. With managed_only=true:\
        \ only those with managed devices."
      operationId: get_tenants_v1_parameter_tenant_get
      parameters:
      - description: Limit to tenants with managed devices
        explode: true
        in: query
        name: managed_only
        required: false
        schema:
          default: false
          description: Limit to tenants with managed devices
          title: Managed Only
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Tenant"
                title: Response Get Tenants V1 Parameter Tenant Get
                type: array
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Tenants
      tags:
      - parameters
  /v1/workflow/:
    get:
      description: Return a filtered list of workflows.
      operationId: get_workflows_v1_workflow__get
      parameters:
      - explode: true
        in: query
        name: user
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: workflow_type
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: workflow_id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: device_id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: device_name
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: device_role
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: device_platform
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: site
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: status
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: pending_approval
        required: false
        schema:
          nullable: true
          type: boolean
        style: form
      - explode: true
        in: query
        name: start_time
        required: false
        schema:
          format: date-time
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: end_time
        required: false
        schema:
          format: date-time
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: hide_completed
        required: false
        schema:
          default: false
          title: Hide Completed
          type: boolean
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          title: Limit
          type: integer
        style: form
      - explode: true
        in: query
        name: next_page_token
        required: false
        schema:
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowListResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get Workflows
      tags:
      - workflow
  /v1/workflow/hello_world:
    post:
      description: Simple hello world workflow for testing and demonstration
      operationId: helloworld_endpoint_v1_workflow_hello_world_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelloWorldInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Execute HelloWorld
      tags:
      - workflow
  /v1/workflow/hello_world_approval:
    post:
      description: Hello world workflow with approval step for testing staged workflows
      operationId: helloworldapproval_endpoint_v1_workflow_hello_world_approval_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelloWorldInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Execute HelloWorldApproval
      tags:
      - workflow
  /v1/workflow/metadata:
    get:
      description: Return registered workflow metadata and RBAC roles.
      operationId: get_workflow_metadata_v1_workflow_metadata_get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowMetadataResponse"
          description: Successful Response
      summary: Get Workflow Metadata
      tags:
      - workflow
  /v1/workflow/ngc/backup:
    post:
      description: Backup network device configuration to the Config Store and NVIDIA
        Config Manager plugin
      operationId: backupworkflow_endpoint_v1_workflow_ngc_backup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Execute BackupWorkflow
      tags:
      - workflow
  /v1/workflow/ngc/batch_deploy:
    post:
      description: Deploy configurations to a batch of devices with shared diff content
      operationId: batchdeployworkflow_endpoint_v1_workflow_ngc_batch_deploy_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchDeployInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Execute BatchDeployWorkflow
      tags:
      - workflow
  /v1/workflow/ngc/connected_host_metadata:
    post:
      description: Discover and analyze connected hosts via MAC table and LLDP neighbor
        data
      operationId: connectedhostmetadataworkflow_endpoint_v1_workflow_ngc_connected_host_metadata_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectedHostWorkflowInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Execute ConnectedHostMetadataWorkflow
      tags:
      - workflow
  /v1/workflow/ngc/cumulus_hardware_validation:
    post:
      description: "Validate hardware components (fans, PSUs, LEDs, voltage) across\
        \ network devices"
      operationId: validatehardwareworkflow_endpoint_v1_workflow_ngc_cumulus_hardware_validation_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateHardwareInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Execute ValidateHardwareWorkflow
      tags:
      - workflow
  /v1/workflow/ngc/deploy:
    post:
      description: Deploy intended configuration to network device with approval workflow
      operationId: deployworkflow_endpoint_v1_workflow_ngc_deploy_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeployInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Execute DeployWorkflow
      tags:
      - workflow
  /v1/workflow/ngc/device_cable_validation:
    post:
      description: Validate cable connections for a specific device against intended
        topology
      operationId: devicecablevalidationworkflow_endpoint_v1_workflow_ngc_device_cable_validation_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCableValidationInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Execute DeviceCableValidationWorkflow
      tags:
      - workflow
  /v1/workflow/ngc/device_password_rotation:
    post:
      description: Rotate passwords on network devices with validation and approval
        workflow
      operationId: devicepasswordrotationworkflow_endpoint_v1_workflow_ngc_device_password_rotation_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePasswordRotationInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Execute DevicePasswordRotationWorkflow
      tags:
      - workflow
  /v1/workflow/ngc/diagnostics:
    post:
      description: Run diagnostic commands against network devices and attach results
        to a ticketing issue
      operationId: diagnosticsworkflow_endpoint_v1_workflow_ngc_diagnostics_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosticsWorkflowInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Execute DiagnosticsWorkflow
      tags:
      - workflow
  /v1/workflow/ngc/ib_pkey_creation:
    post:
      description: Create an InfiniBand PKey partition on UFM for multi-tenant isolation
      operationId: ibpkeycreationworkflow_endpoint_v1_workflow_ngc_ib_pkey_creation_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IBPKeyCreationInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Execute IBPKeyCreationWorkflow
      tags:
      - workflow
  /v1/workflow/ngc/ib_pkey_member_add:
    post:
      description: Add device interfaces to an existing InfiniBand PKey partition
      operationId: ibpkeymemberaddworkflow_endpoint_v1_workflow_ngc_ib_pkey_member_add_post
      requestBody:
        content:

components:
  schemas:
    BackupInput:
      description: Backup Workflow Input Definiton.
      example:
        workflow_id: workflow_id
        device_id: device_id
        user_domain: user_domain
        trigger: SCHEDULED
        user: user
        intended_config_commit_id: intended_config_commit_id
      properties:
        device_id:
          title: Device Id
          type: string
        intended_config_commit_id:
          nullable: true
          type: string
        trigger:
          $ref: "#/components/schemas/TriggerEnum"
        user:
          nullable: true
          type: string
        user_domain:
          nullable: true
          type: string
        workflow_id:
          nullable: true
          type: string
      required:
      - device_id
      - intended_config_commit_id
      - trigger
      - user
      - user_domain
      - workflow_id
      title: BackupInput
    BatchDeployInput:
      description: Input for batch deploy child workflow.
      example:
        parent_workflow_id: parent_workflow_id
        commit_confirm: true
        batch_number: 6
        diff_group:
          diff_hash: diff_hash
          devices:
          - diff: diff
            error: error
            intended_config: intended_config
            commit_id: commit_id
            device:
              rack: rack
              role: role
              config_context:
                key: ""
              device_type: device_type
              render_enabled: false
              ztp_enabled: false
              platform: arista-eos
              backup_enabled: false
              site: site
              name: name
              id: id
              position: 0
              primary_ip6: primary_ip6
              deploy_enabled: false
              primary_ip4: primary_ip4
          - diff: diff
            error: error
            intended_config: intended_config
            commit_id: commit_id
            device:
              rack: rack
              role: role
              config_context:
                key: ""
              device_type: device_type
              render_enabled: false
              ztp_enabled: false
              platform: arista-eos
              backup_enabled: false
              site: site
              name: name
              id: id
              position: 0
              primary_ip6: primary_ip6
              deploy_enabled: false
              primary_ip4: primary_ip4
          diff_content: diff_content
        batch_devices:
        - diff: diff
          error: error
          intended_config: intended_config
          commit_id: commit_id
          device:
            rack: rack
            role: role
            config_context:
              key: ""
            device_type: device_type
            render_enabled: false
            ztp_enabled: false
            platform: arista-eos
            backup_enabled: false
            site: site
            name: name
            id: id
            position: 0
            primary_ip6: primary_ip6
            deploy_enabled: false
            primary_ip4: primary_ip4
        - diff: diff
          error: error
          intended_config: intended_config
          commit_id: commit_id
          device:
            rack: rack
            role: role
            config_context:
              key: ""
            device_type: device_type
            render_enabled: false
            ztp_enabled: false
            platform: arista-eos
            backup_enabled: false
            site: site
            name: name
            id: id
            position: 0
            primary_ip6: primary_ip6
            deploy_enabled: false
            primary_ip4: primary_ip4
      properties:
        batch_devices:
          items:
            $ref: "#/components/schemas/DeviceDiffData"
          title: Batch Devices
          type: array
        batch_number:
          nullable: true
          type: integer
        commit_confirm:
          default: true
          title: Commit Confirm
          type: boolean
        diff_group:
          $ref: "#/components/schemas/DiffGroup"
        parent_workflow_id:
          title: Parent Workflow Id
          type: string
      required:
      - batch_devices
      - diff_group
      - parent_workflow_id
      title: BatchDeployInput
    CommandEntry:
      description: A single command in the diagnostics catalog.
      example:
        name: name
        description: description
      properties:
        description:
          title: Description
          type: string
        name:
          title: Name
          type: string
      required:
      - description
      - name
      title: CommandEntry
    ConnectedHostWorkflowInput:

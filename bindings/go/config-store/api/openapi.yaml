openapi: 3.1.0
info:
  description: PostgreSQL-backed configuration storage service
  title: Config Store API
  version: 0.1.0
servers:
- url: /
paths:
  /v1/admin/cache/status:
    get:
      description: Check if cache service is initialized and working.
      operationId: cache_status_v1_admin_cache_status_get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheStatusResponse"
          description: Successful Response
      summary: Check cache service status
      tags:
      - admin
  /v1/admin/cache/test/{device_uuid}:
    get:
      description: Test if a specific device can be found in cache.
      operationId: test_cache_lookup_v1_admin_cache_test__device_uuid__get
      parameters:
      - explode: false
        in: path
        name: device_uuid
        required: true
        schema:
          format: uuid
          title: Device Uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response_Test_Cache_Lookup_V1_Admin_Cache_Test__Device_Uuid__Get"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Test cache lookup for a device
      tags:
      - admin
  /v1/admin/devices:
    get:
      description: List all devices with configs.
      operationId: list_devices_v1_admin_devices_get
      parameters:
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          title: Limit
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          title: Offset
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/DeviceUUID"
                title: Response List Devices V1 Admin Devices Get
                type: array
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: List all devices
      tags:
      - admin
  /v1/admin/devices/search:
    get:
      description: |-
        Search devices by name with their latest configuration metadata.

        If q is not provided, returns the 100 most recently updated devices from DB.
        If q is provided, uses Redis cache to find matching device names and their UUIDs,
        then fetches their latest config info from DB.
        Results are sorted by most recent update first.
        Results are filtered by file_type (intended or backup).
        Inactive devices (removed from nv_config_manager/Nautobot) are hidden unless include_inactive is True.
      operationId: search_devices_v1_admin_devices_search_get
      parameters:
      - explode: true
        in: query
        name: q
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          title: Limit
          type: integer
        style: form
      - explode: true
        in: query
        name: file_type
        required: false
        schema:
          allOf:
          - $ref: "#/components/schemas/FileType"
          default: intended
        style: form
      - explode: true
        in: query
        name: include_inactive
        required: false
        schema:
          default: false
          title: Include Inactive
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/DeviceLatestConfig"
                title: Response Search Devices V1 Admin Devices Search Get
                type: array
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Search devices by name with latest config info
      tags:
      - admin
  /v1/admin/devices/{device_uuid}:
    delete:
      description: |-
        Permanently delete all configuration files and version history for a device.

        This action cannot be undone. All config versions (intended and backup)
        for the specified device will be removed from the database.
      operationId: delete_device_v1_admin_devices__device_uuid__delete
      parameters:
      - explode: false
        in: path
        name: device_uuid
        required: true
        schema:
          format: uuid
          title: Device Uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteDeviceResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Permanently delete all configs for a device
      tags:
      - admin
  /v1/admin/stats:
    get:
      description: Get statistics about the config store.
      operationId: get_stats_v1_admin_stats_get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
          description: Successful Response
      summary: Get database statistics
      tags:
      - admin
  /v1/config/device/{device_uuid}:
    get:
      description: Get all latest configuration files for a device.
      operationId: get_device_configs_v1_config_device__device_uuid__get
      parameters:
      - explode: false
        in: path
        name: device_uuid
        required: true
        schema:
          format: uuid
          title: Device Uuid
          type: string
        style: simple
      - explode: true
        in: query
        name: file_type
        required: false
        schema:
          allOf:
          - $ref: "#/components/schemas/FileType"
          nullable: true
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ConfigResponse"
                title: Response Get Device Configs V1 Config Device  Device Uuid  Get
                type: array
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get all configs for a device
      tags:
      - config
  /v1/config/{device_uuid}/batch:
    post:
      description: Batch create or update configuration files for a device.
      operationId: batch_create_configs_v1_config__device_uuid__batch_post
      parameters:
      - explode: false
        in: path
        name: device_uuid
        required: true
        schema:
          format: uuid
          title: Device Uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchConfigRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchConfigResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Batch create/update config files
      tags:
      - config
  /v1/config/{device_uuid}/{filename}:
    get:
      description: |-
        Get a configuration file.

        If version is not specified, returns the latest version.
      operationId: get_config_v1_config__device_uuid___filename__get
      parameters:
      - explode: false
        in: path
        name: device_uuid
        required: true
        schema:
          format: uuid
          title: Device Uuid
          type: string
        style: simple
      - explode: false
        in: path
        name: filename
        required: true
        schema:
          title: Filename
          type: string
        style: simple
      - explode: true
        in: query
        name: file_type
        required: false
        schema:
          allOf:
          - $ref: "#/components/schemas/FileType"
          default: intended
        style: form
      - explode: true
        in: query
        name: version
        required: false
        schema:
          nullable: true
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get a config file
      tags:
      - config
    post:
      description: |-
        Create or update a configuration file.

        If the content has not changed, the existing version is returned without creating a new one.
      operationId: create_config_v1_config__device_uuid___filename__post
      parameters:
      - explode: false
        in: path
        name: device_uuid
        required: true
        schema:
          format: uuid
          title: Device Uuid
          type: string
        style: simple
      - explode: false
        in: path
        name: filename
        required: true
        schema:
          title: Filename
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigCreateRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Create or update a config file
      tags:
      - config
  /v1/config/{device_uuid}/{filename}/diff:
    get:
      description: Generate a diff between two versions of a configuration file.
      operationId: get_diff_v1_config__device_uuid___filename__diff_get
      parameters:
      - explode: false
        in: path
        name: device_uuid
        required: true
        schema:
          format: uuid
          title: Device Uuid
          type: string
        style: simple
      - explode: false
        in: path
        name: filename
        required: true
        schema:
          title: Filename
          type: string
        style: simple
      - explode: true
        in: query
        name: from_version
        required: true
        schema:
          title: From Version
          type: integer
        style: form
      - explode: true
        in: query
        name: to_version
        required: true
        schema:
          title: To Version
          type: integer
        style: form
      - explode: true
        in: query
        name: file_type
        required: false
        schema:
          allOf:
          - $ref: "#/components/schemas/FileType"
          default: intended
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Get diff between two versions
      tags:
      - config
  /v1/config/{device_uuid}/{filename}/versions:
    get:
      description: List all versions of a configuration file.
      operationId: list_versions_v1_config__device_uuid___filename__versions_get
      parameters:
      - explode: false
        in: path
        name: device_uuid
        required: true
        schema:
          format: uuid
          title: Device Uuid
          type: string
        style: simple
      - explode: false
        in: path
        name: filename
        required: true
        schema:
          title: Filename
          type: string
        style: simple
      - explode: true
        in: query
        name: file_type
        required: false
        schema:
          allOf:
          - $ref: "#/components/schemas/FileType"
          default: intended
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          title: Limit
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigVersionsResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: List all versions of a config file
      tags:
      - config
  /whoami:
    get:
      description: Reflect the caller's identity as seen by this service.
      operationId: whoami_whoami_get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoamiResponse"
          description: Successful Response
      summary: Current User Info
components:
  schemas:
    BatchConfigItem:
      description: Single item in batch request.
      example:
        filename: filename
        author: author
        file_type: ""
        created_at: 2000-01-23T04:56:07.000+00:00
        commit_message: commit_message
        content: content
      properties:
        author:
          description: Author email
          title: Author
          type: string
        commit_message:
          description: Commit message
          title: Commit Message
          type: string
        content:
          description: Configuration file content
          title: Content
          type: string
        created_at:
          format: date-time
          nullable: true
          type: string
        file_type:
          allOf:
          - $ref: "#/components/schemas/FileType"
          default: intended
          description: Config file type (intended or backup)
        filename:
          description: File name
          title: Filename
          type: string
      required:
      - author
      - commit_message
      - content
      - filename
      title: BatchConfigItem
    BatchConfigRequest:
      description: Batch config creation request.
      example:
        files:
        - filename: filename
          author: author
          file_type: ""
          created_at: 2000-01-23T04:56:07.000+00:00
          commit_message: commit_message
          content: content
        - filename: filename
          author: author
          file_type: ""
          created_at: 2000-01-23T04:56:07.000+00:00
          commit_message: commit_message
          content: content
      properties:
        files:
          description: List of files to create/update
          items:
            $ref: "#/components/schemas/BatchConfigItem"
          title: Files
          type: array
      required:
      - files
      title: BatchConfigRequest
    BatchConfigResponse:
      description: Batch config creation response.
      example:
        created:
        - author: author
          file_type: ""
          created_at: 2000-01-23T04:56:07.000+00:00
          commit_message: commit_message
          content_hash: content_hash
          version: 0
        - author: author
          file_type: ""
          created_at: 2000-01-23T04:56:07.000+00:00
          commit_message: commit_message
          content_hash: content_hash
          version: 0
        skipped:
        - skipped
        - skipped
      properties:
        created:
          description: Successfully created/updated files
          items:
            $ref: "#/components/schemas/ConfigVersionResponse"
          title: Created
          type: array
        skipped:
          description: Paths that had no changes
          items:
            type: string
          title: Skipped
          type: array
      required:
      - created
      title: BatchConfigResponse
    CacheStatusResponse:
      description: Cache service status response.
      example:
        cache_ttl: 0
        message: message
        nautobot_connected: true
        redis_connected: true
        enabled: true
      properties:
        cache_ttl:
          nullable: true
          type: integer
        enabled:
          description: Whether cache service is enabled
          title: Enabled
          type: boolean
        message:
          nullable: true
          type: string
        nautobot_connected:
          nullable: true
          type: boolean
        redis_connected:
          nullable: true
          type: boolean
      required:
      - enabled
      title: CacheStatusResponse
    CacheTestErrorResponse:
      description: Cache test response when there's an error.
      properties:
        device_uuid:
          description: Device UUID
          title: Device Uuid
          type: string
        error:
          description: Error message
          title: Error
          type: string
      required:
      - device_uuid
      - error
      title: CacheTestErrorResponse
    CacheTestFoundResponse:
      description: Cache test response when device is found.
      example:
        device_name: device_name
        site: site
        found: true
        device_uuid: device_uuid
        platform: platform
      properties:
        device_name:
          description: Device name
          title: Device Name
          type: string
        device_uuid:
          description: Device UUID
          title: Device Uuid
          type: string
        found:
          default: true
          description: Whether device was found
          title: Found
          type: boolean
        platform:
          nullable: true
          type: string
        site:
          description: Site name
          title: Site
          type: string
      required:
      - device_name
      - device_uuid
      - platform
      - site
      title: CacheTestFoundResponse
    CacheTestNotFoundResponse:
      description: Cache test response when device is not found.
      properties:
        device_uuid:
          description: Device UUID
          title: Device Uuid
          type: string
        found:
          default: false
          description: Whether device was found
          title: Found
          type: boolean
        message:
          description: Not found message
          title: Message
          type: string
      required:
      - device_uuid
      - message
      title: CacheTestNotFoundResponse
    ConfigCreateRequest:
      description: Request to create/update a config file.
      example:
        author: author
        file_type: ""
        created_at: 2000-01-23T04:56:07.000+00:00
        commit_message: commit_message
        content: content
      properties:
        author:
          description: Author email
          title: Author
          type: string
        commit_message:
          description: Commit message describing the change
          title: Commit Message
          type: string
        content:
          description: Configuration file content
          title: Content
          type: string
        created_at:
          format: date-time
          nullable: true
          type: string
        file_type:
          allOf:
          - $ref: "#/components/schemas/FileType"
          default: intended
          description: Config file type (intended or backup)
      required:
      - author
      - commit_message
      - content
      title: ConfigCreateRequest
    ConfigResponse:
      description: Response with full config data.
      example:
        filename: filename
        author: author
        file_type: ""
        created_at: 2000-01-23T04:56:07.000+00:00
        commit_message: commit_message
        content_hash: content_hash
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        device: ""
        version: 0
        content: content
        device_uuid: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        author:
          description: Author email
          title: Author
          type: string
        commit_message:
          description: Commit message
          title: Commit Message
          type: string
        content:
          description: Configuration file content
          title: Content
          type: string
        content_hash:
          description: SHA256 hash of content
          title: Content Hash
          type: string
        created_at:
          description: Timestamp when version was created
          format: date-time
          title: Created At
          type: string
        device:
          allOf:
          - $ref: "#/components/schemas/DeviceMetadata"
          nullable: true
        device_uuid:
          description: Device UUID
          format: uuid
          title: Device Uuid
          type: string
        file_type:
          allOf:
          - $ref: "#/components/schemas/FileType"
          description: Config file type (intended or backup)
        filename:
          description: File name
          title: Filename
          type: string
        id:
          description: Config file ID
          format: uuid
          title: Id
          type: string
        version:
          description: Version number
          title: Version
          type: integer
      required:
      - author
      - commit_message
      - content
      - content_hash
      - created_at
      - device_uuid
      - file_type
      - filename
      - id
      - version
      title: ConfigResponse
    ConfigVersionResponse:
      description: Response with version metadata.
      example:
        author: author
        file_type: ""
        created_at: 2000-01-23T04:56:07.000+00:00
        commit_message: commit_message
        content_hash: content_hash
        version: 0
      properties:
        author:
          description: Author email
          title: Author
          type: string
        commit_message:
          description: Commit message
          title: Commit Message
          type: string
        content_hash:
          description: SHA256 hash of content
          title: Content Hash
          type: string
        created_at:
          description: Timestamp when version was created
          format: date-time
          title: Created At
          type: string
        file_type:
          allOf:
          - $ref: "#/components/schemas/FileType"
          description: Config file type (intended or backup)
        version:
          description: Version number
          title: Version
          type: integer
      required:
      - author
      - commit_message
      - content_hash
      - created_at
      - file_type
      - version
      title: ConfigVersionResponse
    ConfigVersionsResponse:
      description: Response with list of versions.
      example:
        filename: filename
        versions:
        - author: author
          file_type: ""
          created_at: 2000-01-23T04:56:07.000+00:00
          commit_message: commit_message
          content_hash: content_hash
          version: 0
        - author: author
          file_type: ""
          created_at: 2000-01-23T04:56:07.000+00:00
          commit_message: commit_message
          content_hash: content_hash
          version: 0
        device: ""
        device_uuid: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        device:
          allOf:
          - $ref: "#/components/schemas/DeviceMetadata"
          nullable: true
        device_uuid:
          description: Device UUID
          format: uuid
          title: Device Uuid
          type: string
        filename:
          description: File name
          title: Filename
          type: string
        versions:
          description: List of versions
          items:
            $ref: "#/components/schemas/ConfigVersionResponse"
          title: Versions
          type: array
      required:
      - device_uuid
      - filename
      - versions
      title: ConfigVersionsResponse
    DeleteDeviceResponse:
      description: Response for device config deletion.
      example:
        deleted_versions: 0
        message: message
        device_uuid: device_uuid
      properties:
        deleted_versions:
          description: Number of config versions deleted
          title: Deleted Versions
          type: integer
        device_uuid:
          description: Device UUID
          title: Device Uuid
          type: string
        message:
          description: Human-readable result message
          title: Message
          type: string
      required:
      - deleted_versions
      - device_uuid
      - message
      title: DeleteDeviceResponse
    DeviceLatestConfig:
      description: Device with its latest config metadata.
      example:
        site: site
        latest_message: latest_message
        latest_update: latest_update
        latest_author: latest_author
        name: name
        active: true
        uuid: uuid
      properties:
        active:
          default: true
          description: Whether the device is currently active in nv-config-manager
          title: Active
          type: boolean
        latest_author:
          description: Author of latest change
          title: Latest Author
          type: string
        latest_message:
          description: Commit message of latest change
          title: Latest Message
          type: string
        latest_update:
          description: Latest config update timestamp
          title: Latest Update
          type: string
        name:
          description: Device name
          title: Name
          type: string
        site:
          description: Site name
          title: Site
          type: string
        uuid:
          description: Device UUID
          title: Uuid
          type: string
      required:
      - latest_author
      - latest_message
      - latest_update
      - name
      - site
      - uuid
      title: DeviceLatestConfig
    DeviceMetadata:
      description: Device metadata from Nautobot.
      properties:
        last_updated:
          format: date-time
          nullable: true
          type: string
        name:
          description: Device name
          title: Name
          type: string
        nautobot_url:
          nullable: true
          type: string
        platform:
          nullable: true
          type: string
        primary_ip4:
          nullable: true
          type: string
        rack:
          nullable: true
          type: string
        role:
          nullable: true
          type: string
        site:
          description: Site name
          title: Site
          type: string
      required:
      - name
      - site
      title: DeviceMetadata
    DeviceUUID:
      description: Device UUID entry.
      example:
        uuid: uuid
      properties:
        uuid:
          description: Device UUID
          title: Uuid
          type: string
      required:
      - uuid
      title: DeviceUUID
    DiffResponse:
      description: Response with diff between two versions.
      example:
        filename: filename
        old_content: old_content
        diff_stats:
          key: 0
        diff: diff
        from_version: 6
        to_version: 1
        device: ""
        device_uuid: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        new_content: new_content
      properties:
        device:
          allOf:
          - $ref: "#/components/schemas/DeviceMetadata"
          nullable: true
        device_uuid:
          description: Device UUID
          format: uuid
          title: Device Uuid
          type: string
        diff:
          description: Unified diff output
          title: Diff
          type: string
